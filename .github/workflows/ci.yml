name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # After setup-node, not before: it installs its own Node, and on the Windows runner the
      # global Yarn 1 that ships with the image wins the PATH until corepack is enabled against
      # that Node. `cache: yarn` goes with it, since it would run before corepack is ready.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  # Runs the same client against the ASCOM Initiative's own simulators, which is where a misreading
  # of the Alpaca specification shows up. Kept separate: it downloads ~50 MB and takes a minute.
  omnisim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/cache@v4
        with:
          path: .cache/omnisim
          key: omnisim-${{ runner.os }}-${{ hashFiles('scripts/fetch-omnisim.mjs') }}
      - run: yarn test:sim

  # The processing side against a real Siril. Separate again: it downloads ~90 MB and the AppImage
  # needs unpacking, which is worth proving on Linux rather than assuming.
  siril:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/cache@v4
        with:
          path: .cache/siril
          key: siril-${{ runner.os }}-${{ hashFiles('scripts/fetch-siril.mjs') }}
      - run: yarn test:siril
